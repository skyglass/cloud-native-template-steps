apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kafka
  namespace: default
spec:
  chart:
    spec:
      chart: kafka
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: eventuate
      version: "v0.4.0"
  interval: 15s
  values:
    persistence:
      enabled: true
      size: 10Gi
      storageClassName: kafka-sc